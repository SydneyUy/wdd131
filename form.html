<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="week03/styles/place.css">
    <meta name="description" content="This is a page showcasing a form for reviewing a product.">
    <meta name="author" content="Sydney Uy">
    <link rel="stylesheet" href="week05/styles/form.css">
    <title>Product Review Form</title>

</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>
    <main>
        <form method="get" action="review.html">
        <fieldset>
            <legend>Select Product</legend>
            <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product&#9662;</option>
            </select>
        </fieldset>

        <fieldset>
            <legend>Overall Rating</legend>
            <label><input type="radio" id="one-rating" name="rating" value="&star;" required>&star;</label>
            <label><input type="radio" id="two-rating" name="rating" value="&star; &star;" required>&star; &star;</label>
            <label><input type="radio" id="three-rating" name="rating" value="&star; &star; &star;" required>&star; &star; &star;</label>
            <label><input type="radio" id="four-rating" name="rating" value="&star; &star; &star; &star;" required>&star; &star; &star; &star;</label>
            <label><input type="radio" id="five-rating" name="rating" value="&star; &star; &star; &star; &star;" required>&star; &star; &star; &star; &star;</label>
        </fieldset>

        <fieldset>
            <legend>Date of Installation</legend>
            <input type="date" id="datein" name="datein" required>
        </fieldset>

        <fieldset>
            <legend>Useful Features</legend>
            <p>Which features did you find useful in the product? <i>(Check all that apply.)</i><p>
            <label><input type="checkbox" id="durability" name="features" value="durability">Durability</label>
            <label><input type="checkbox" id="ease" name="features" value="Ease">Ease of Use</label>
            <label><input type="checkbox" id="performance" name="features" value="Performance">Performance</label>
            <label><input type="checkbox" id="design" name="features" value="Design">Design</label>
        </fieldset>

        <fieldset>
            <legend>Written Review (Optional)</legend>
            <textarea id="review" name="review" rows="4" cols="20"></textarea>
            <label>Username (Optional)</label>
            <input type="text">

        </fieldset>

        <input type="submit" value="Submit My Review">


        </form>
    </main>
    <footer>
        <p>&copy; 2026 Sydney Uy <br> Last Modification: 
        <span id="modified-date">0/0/00 0:00:00 AM</span></p>
    </footer>
    <script src="week05/scripts/form.js" defer></script>
</body>
</html>
